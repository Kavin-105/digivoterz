name: Build & Push Docker Images (Develop)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Determine changed folders
      - name: Determine changed folders
        id: changes
        run: |
          echo "CHANGED_FRONTEND=false" >> $GITHUB_ENV
          echo "CHANGED_BACKEND=false" >> $GITHUB_ENV

          # Ensure full history to avoid shallow checkout issues
          git fetch origin develop --prune --unshallow || true

          # Find changed files compared to the previous commit on develop
          CHANGED_FILES=$(git diff --name-only origin/develop~1..origin/develop)
          echo "Changed files detected:"
          echo "$CHANGED_FILES"

          # Check if any frontend files changed
          if echo "$CHANGED_FILES" | grep -q '^frontend/'; then
            echo "CHANGED_FRONTEND=true" >> $GITHUB_ENV
            echo "Frontend changes detected."
          fi

          # Check if any backend files changed
          if echo "$CHANGED_FILES" | grep -q '^backend/'; then
            echo "CHANGED_BACKEND=true" >> $GITHUB_ENV
            echo "Backend changes detected."
          fi

      # Step 5: Build & push frontend if changed
      - name: Build & Push Frontend
        if: env.CHANGED_FRONTEND == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: kavin105/digivoterz-frontend:v3

      # Step 6: Build & push backend if changed
      - name: Build & Push Backend
        if: env.CHANGED_BACKEND == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: kavin105/digivoterz-backend:v3